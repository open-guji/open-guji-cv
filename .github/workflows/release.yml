name: Release assets

# 推 vX.Y.Z / vX.Y.Z-rc.N tag 时，构建 wheel ＋ 资源包并挂到该 tag 的 GitHub Release
# （没有就建；MINOR 的正文由人手写，已有 Release 时只补附件）。设计见 doc/design/发版附带Python执行包.md。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（如 v0.5.9）
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 正式版的 pyproject 版本须与 tag 一致（rc 不查：版本号在发版时才改）
        run: |
          case "$TAG" in *-rc.*) exit 0;; esac
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "$TAG" ] || { echo "pyproject 版本 $v 与 tag $TAG 不符"; exit 1; }
      - run: pip install build
      - run: python scripts/build_release_assets.py
      - name: 建 Release（若无）并上传附件
        run: |
          pre=""; case "$TAG" in *-rc.*) pre="--prerelease";; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" $pre --verify-tag --title "$TAG" \
              --notes "自动构建的执行包附件。安装：下载 install_release.py 与同目录附件，运行 python install_release.py --dir <附件目录>。变更见 CHANGELOG.md。"
          fi
          gh release upload "$TAG" dist/release/* --clobber
