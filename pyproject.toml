[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-guji-cv"
version = "0.1.0"
description = "古籍图像 OCR 分析工具包：逐字识别、版面检测、字符网格"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ocr", "classical-chinese", "ancient-books", "image-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# ── 核心依赖（不含 paddle，因为 GPU/CPU 版本不同）──────────────────────
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    # 四个抽象（core / products）：产物契约用 pydantic，pipeline / book 定义用 yaml
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# CPU 模式：pip install open-guji-cv[cpu]
cpu = [
    "paddlepaddle>=3.0.0b2",
    "paddleocr>=2.8.0",
]
# GPU 模式：先手动 pip install paddlepaddle-gpu，再 pip install open-guji-cv[gpu]
# 详见 install_gpu.sh / install_gpu.bat
gpu = [
    "paddleocr>=2.8.0",
]
# 轻量 OCR：PP-OCRv4 的 ONNX 版，模型随包分发（无需联网下载模型），
# 无 GPU / 无法访问模型源的环境用这个跑 label --sources rapidocr
onnx = [
    "rapidocr-onnxruntime>=1.3",
]
# torch 模型：生僻字 CNN 候选（clustering/cnn_candidates.py：分类头 + embedding 检索）
# 与切点 U-Net 判官（utils/cut_select.py）。两处都**懒导入 + 缺件降级**，不装也能跑
# （`CnnCandidates.available` 为 False 时候选退回字体 HOG，UNetJudge 任何异常返回 None），
# 所以它是 extra 不是核心依赖——与 paddle 同一个理由：装哪个轮子（CPU / CUDA 版本）
# 得由环境定，写死在 dependencies 里会逼所有人拖一个几百 MB 的包。
#
# ⚠️ 不装的代价是**测试会静默少覆盖**：2026-09-15 实测本机 venv 没装 torch，
# tests/test_cnn_candidates.py 5 条全跳过；更早之前守卫只查 checkpoint 不查 torch，
# 其中 3 条断言太弱（`len([]) <= 3`）一直在假通过，另 2 条才红出来。
# 跑测试想覆盖 CNN 那几条就装这个 extra；推理只用 CPU 轮子就够（两处都 CPU/CUDA 自适应）。
torch = [
    "torch>=2.0",
]
# 开发依赖：pip install open-guji-cv[dev]
# 本地控制台：pip install open-guji-cv[console]
console = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=7.0",
    # `clustering/font_glyphs.py` 与 `scripts/build_charset.py` 读字体 cmap 要它。
    # 生产代码里是**惰性 import**（不导字体字形就用不到），但测试要覆盖那条路，
    # 所以进 dev。2026-09-20 之前它一处都没声明，tests/clustering/test_font_glyphs.py
    # 因此在没装它的机器上整片报 ModuleNotFoundError。
    "fontTools>=4.0",
    "build>=1.0",
    "twine>=4.0",
    "ruff>=0.4",
]

[project.scripts]
# python -m open_guji_cv 的 CLI 包装
guji-cv = "open_guji_cv.__main__:main"
# 四个抽象的 CLI（pipeline / step / status / console / cache），同样的子命令也挂在 guji-cv 下
guji = "open_guji_cv.cli_v2:main"

[project.urls]
Repository = "https://github.com/your-org/open-guji-cv"
Issues = "https://github.com/your-org/open-guji-cv/issues"

# ── 包发现 ──────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["open_guji_cv*"]
exclude = ["venv*", "output*", "data*", ".claude*"]

[tool.setuptools.package-data]
open_guji_cv = ["py.typed", "pipelines/*.yaml", "books/*.yaml", "console/static/*",
                "clustering/review/static/*"]

# ── 测试 ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
markers = [
    "manual: 依赖真实工作区产物的人工验收测试（如控制台重构快照），默认排除，需要跑时显式加 -m manual",
]
addopts = "-m 'not manual'"
