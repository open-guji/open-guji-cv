# 史記文淵閣本（写本）的切分样页单（切分模块化第 4 步，2026-10-30）。
# 册 yaml 要写 `seg_set: shiji_wyg` 才走本套书的职名页实现（books/shiji_wyg/roster_*）；没写时跑的是殿本那份。
# 现在只有册 01 职名页的问题页，正文页待负责史記的同事补到 10 页以上。
pipeline: keben_body_v2
steps: {from: border_detect, to: cell_shrink}
books:
  - book: "01"
    ws_glob: "988g3f0wsu-*"
    pages:
      32: 正文进表页（不该点名职名——册 yaml 的 roster_pages 不含 32，走正文切法）
      40: 职名页，「臣」斜贴邻字（row_segment 1.42）
      43: 职名页，原任日講官起居注…密排 24 字（整理本字数重切，roster_ref）
      44: 职名页，密排 24／23／24 字三列（同上）
      45: 职名页，密排 19 字列
      47: 职名页，臣粘邻字的列（按全页臣行补臣再切）
      49: 职名页，「貢……生」两字拉开十余格，臣与人名三字
      50: 职名页，密排字压扁相粘，内務府…20 字
      51: 职名页，臣粘掌字的列
      52: 职名页
      139: 卷末大印压职名列（要 seal_detect.overrides 挡印；整页前三列是正文、第 4 列一列三个臣，整理本行数与列数对不上，refit 整页不动）
