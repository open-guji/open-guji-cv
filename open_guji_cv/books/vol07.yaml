# 同批 vol04/vol05 已逐页核实卷次描述与实际内容一致，此册未单独核实）。
id: vol07
title: 欽定四庫全書總目·經部十二~十三·書類存目一~二·卷十二~卷十三（vol07）
edition: keben
raw_dir: data_full/zongmu/vol07
raw_pattern: "{page}.png"
expected_cols: 9
chars_per_line: 21
dev_set: []

# Step0 预清理（默认不开，只对下面登记的页生效；坐标 = 原图像素）
preclean:
  46:
    - kind: inverted_rect
      x0: 545
      x1: 945
      y0: 309
      y1: 413
      gate_override: 0.30
      gate_reason: 矩形含抬头框的框线本身（上边框 0.825、内框线 0.676），那是真墨不是残留
      note: |
        抬头框**整格被翻**：第 7、8 列（竖排从右往左数）抬头那一格，
        「勅」「祇」两字连同外框、界行一起黑白反转，是个齐整的 1×2 矩形
        （x545-945, y309-413）。2026-09-12 用户指出位置后量准。

        **这条用 `inverted_rect` 不用 `inverted_band`**：坏区四边就是框线本身，
        不是「一级级抬高的梯形」。`inverted_band` 的逐列量法在这里会**把字啃坏** ——
        它靠「列间纸列在带内是一整段纯黑」定上下沿，而格内的字笔画把那段黑截断，
        量出来的沿就顺着笔画跑，实测「祇」被啃成几块黑斑（对照图看得很清楚）。
        矩形是已知的规则形状，直接给四个数，不要去"量"。

        反色前矩形内墨占比 0.710 → 反色后 0.290，高于全局闸 0.25，故 `gate_override: 0.30`。
        **超阈的来源已查清：矩形把抬头框的框线一起圈进来了**，那些线本来就是黑的——
        修后逐行看，y309（框上边）0.825、y325（内框线）0.676，其余行 0.16-0.43；
        同页「聖祖」那个没被翻的抬头框，同样口径量得 0.203，量级相当。
        所以这 0.290 是框线的墨，不是没修干净。
  78:
    - kind: inverted_band
      segments: [[361, 1964]]
      y_lo: 540        # 搜索窗
      y_hi: 700
      y_probe: 620     # 窗内一定落在带里的一行
      note: |
        正文中部一条粗反色带（带内黑白翻转，纸成黑、字成白），整行字全在带内。
        2026-09-12 加「界行救援」判据后才扫出来 —— 此前 vol07 是零候选册。
        反色前带内墨占比 0.766，反色后 0.234 过闸。反色后逐字核对
        「鄭書經書沮河吕傳寅」笔画完整，与上行、下行「元辨注傳水灘梁之之」风格一致。

notes: |
  2026-09-10 首次拉取转换，尚未跑过任何 Step，未逐页核实版式。

