# Step0 预清理（默认不开，只对下面登记的页生效；坐标 = 原图像素）
preclean:
  17:
    - kind: inverted_band
      segments: [[483, 1979]]
      y_lo: 1020       # 搜索窗要框住整条带：右半幅上沿高到 1038，窗口收窄会切掉
      y_hi: 1170
      y_probe: 1145    # 窗内一定落在带里的一行（取带的最下部，各列都还在带内）
      note: |
        正文中部一条反色带（带内黑白翻转，纸成黑、字成白）。2026-09-12 扫描器
        改判据后新发现，此前未登记。边界是阶梯形：左半幅薄（y1139-1151），
        右半幅厚（上沿抬到 1038），所以 y_lo 要给到 1020，y_probe 取 1145
        （最下部，逐列都还在带内）。反色前带内墨占比 0.800，反色后 0.200 过闸
        （BODY_INK_GATE=0.25；vol04 本底中位 0.185 / p95 0.236 / p99 0.255，
        与 vol02 同量级，闸阈值可沿用）。反色后逐字核对「何天說文繫訟必切」
        「亦佩卦理」笔画完整，与上下行风格一致。
        同册 p3/p5/p218 是抬头框下的**墨污**（非极性翻转），不走 invert_band。
