chars_per_line: 21
dev_set: []

# Step0 预清理（默认不开，只对下面登记的页生效；坐标 = 原图像素）
preclean:
  22:
    - kind: inverted_band
      segments: [[308, 1832]]
      y_lo: 1573       # 搜索窗
      y_hi: 1733
      y_probe: 1653    # 窗内一定落在带里的一行
      note: |
        正文中部一条粗反色带（带内黑白翻转，纸成黑、字成白），整行字全在带内，
        与 vol02 p151 同量级。2026-09-12 扫描器改判据后新发现，此前未登记。
        反色前带内墨占比 0.777，反色后 0.223 过闸（BODY_INK_GATE=0.25；
        vol05 本底中位 0.170 / p95 0.218 / p99 0.239，与 vol02 同量级，
        闸阈值可沿用）。反色后逐字核对「曰曰下附意曰朱篇」笔画完整，
        与上行「象易以易曰說然書」、下行「圖玩另見辭爲子第」风格一致。
  178:
    - kind: inverted_band
      segments: [[311, 1657]]
      y_lo: 880        # 带在 y914-951，窗口要留出上沿余量
      y_hi: 975
      y_probe: 945     # 取带的下部——上沿逐列抬高（914→930），下沿平在 951
      gate_override: 0.27
      gate_reason: 带穿过字最粗的一段，残留 0.261 是字本身不是没修干净（见 note）
      note: |
        细反色带，只切到字的上半（上沿从左到右一级级抬高 914→930，下沿平在 951）。
        2026-09-12 新发现。反色前带内墨占比 0.739，反色后 **0.261，高于全局闸
        BODY_INK_GATE=0.25**，所以单页 `gate_override: 0.27`。

        放宽前先证明了「超阈不是修复不彻底」，两条证据：
        1. 把**同形状 mask 平移**到上下无带的正常文本区量一遍，得 0.252（+400px 处）
           ——同量级，说明这点墨是字本身的密度，不是残留的带。
        2. 带内**逐行**拆开看，修后每行都在 0.19-0.35 之间均匀分布，
           边缘没有尖峰——若是 mask 多圈了带外的黑，残留会集中在头尾几行。
        另：vol05 本底自己标过（`--calibrate`：186 页 2038 窗，中位 0.169 /
        p95 0.219 / p99 0.241），与 vol02 同量级，所以**不是本册该整体调闸**，
        就是这一页的带压在字最粗的一段上。

        反色后逐字核对「縣陵紀卷謂觀作說流哉」笔画完整。
