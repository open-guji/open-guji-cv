# 《欽定四庫全書總目》武英殿刻本 經部八~九·易類存目·卷八~卷九（IA 06061304.cn），vol05
#
# 188 页，与 IA 元数据 imagecount 一致。首页核实为「卷八」（2026-09-10），
# 与网页描述「卷八~卷九」吻合，未逐页核实卷八→卷九的精确分界页。
id: vol05
title: 欽定四庫全書總目·經部八~九·易類存目·卷八~卷九（vol05）
edition: keben
raw_dir: data_full/zongmu/vol05
raw_pattern: "{page}.png"
expected_cols: 9
chars_per_line: 21
dev_set: []

# Step0 预清理（默认不开，只对下面登记的页生效；坐标 = 原图像素）
preclean:
  22:
    - kind: inverted_band
      segments: [[308, 1832]]
      y_lo: 1573       # 搜索窗
      y_hi: 1733
      y_probe: 1653    # 窗内一定落在带里的一行
      note: |
        正文中部一条粗反色带（带内黑白翻转，纸成黑、字成白），整行字全在带内，
        与 vol02 p151 同量级。2026-09-12 扫描器改判据后新发现，此前未登记。
        反色前带内墨占比 0.777，反色后 0.223 过闸（BODY_INK_GATE=0.25；
        vol05 本底中位 0.170 / p95 0.218 / p99 0.239，与 vol02 同量级，
        闸阈值可沿用）。反色后逐字核对「曰曰下附意曰朱篇」笔画完整，
        与上行「象易以易曰說然書」、下行「圖玩另見辭爲子第」风格一致。
  178:
    - kind: inverted_band
      segments: [[311, 1843]]
      y_lo: 880        # 带在 y914-951，窗口要留出上沿余量
      y_hi: 975
      y_probe: 945     # 取带的下部——上沿逐列抬高（914→939），下沿平在 951
      gate_override: 0.28
      gate_reason: 带穿过字最粗的一段，残留 0.267 是字本身不是没修干净（见 note）
      note: |
        细反色带，横跨**全部 9 列**（竖排从右往左数：1-9 列都在带内）。
        上沿从右往左一级级降低（右端 1-2 列 939，中段 930，左端 914），下沿平在 951，
        所以右端 1-2 列的带**明显更窄**。2026-09-12 新发现。

        ⚠️ 初次登记时 segments 只写到 x=1657，**漏掉了右端 1-2 列**（流/哉两列）——
        原因是量横向范围时用「纸列黑占比 > 0.5」当命中判据，而 1-2 列的带只有 13px 高
        （939-951，中段是 914-951 的 38px），黑占比够不到 0.5 就被判为不在带内。
        **教训：带薄的一端会被固定阈值切掉；量横向范围要把阈值放到 0.35 以下
        再看端点收敛到哪（0.35/0.25 都收敛在 1843，0.15 才漂到 2071 那是书口的另一块污）。**

        反色前带内墨占比 0.733，反色后 **0.267，高于全局闸 BODY_INK_GATE=0.25**，
        所以单页 `gate_override: 0.28`。

        放宽前先证明了「超阈不是修复不彻底」，两条证据：
        1. 把**同形状 mask 平移**到上下无带的正常文本区量一遍，得 0.252（+400px 处）
           ——同量级，说明这点墨是字本身的密度，不是残留的带。
        2. 带内**逐行**拆开看，修后每行都在 0.19-0.35 之间均匀分布，
           边缘没有尖峰——若是 mask 多圈了带外的黑，残留会集中在头尾几行。
        另：vol05 本底自己标过（`--calibrate`：186 页 2038 窗，中位 0.169 /
        p95 0.219 / p99 0.241），与 vol02 同量级，所以**不是本册该整体调闸**，
        就是这一页的带压在字最粗的一段上。

        反色后逐字核对 9 列全部：「縣陵紀卷謂觀作說流哉」笔画完整，
        右端 1-2 列的「流」「哉」也已复原（补 segments 之前这两列还是黑的）。

        另：书口（版框以外，x≈1990-2070）还有一块**独立的**扫描污渍
        （y≈940-1080 的粗黑块，比带厚得多、形状也不同），不是这条带的延续，
        且在版框外不含正文，故不登记、不处理。
notes: |
  2026-09-10 首次拉取转换，尚未跑过任何 Step，未逐页核实版式。

