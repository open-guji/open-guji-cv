        改判据后新发现，此前未登记。反色前带内墨占比 0.877，反色后 0.123 过闸
        （BODY_INK_GATE=0.25；vol08 本底中位 0.167 / p95 0.221 / p99 0.240，
        与 vol02 同量级，闸阈值可沿用）。反色后逐字核对「大士一」与相邻
        「至潘龠也辰儒攀通鄒」笔画完整。
