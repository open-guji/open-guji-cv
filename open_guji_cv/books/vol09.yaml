        p95 0.225 / p99 0.241，与 vol02 同量级，闸阈值可沿用）。反色后逐字核对
        「也商題之太進以者以」笔画完整，与上行「刪爲解定色而分增分」、
        下行「後頌裁失襄退前毛後」风格一致。
