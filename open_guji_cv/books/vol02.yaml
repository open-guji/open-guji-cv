# 《欽定四庫全書總目》武英殿刻本 卷首（IA 06061301.cn），vol02 —— 全书 186 页都是正文
id: vol02
title: 欽定四庫全書總目·卷首二（vol02）
edition: keben
raw_dir: data_full/zongmu/vol02
raw_pattern: "{page}.png"
expected_cols: 9
chars_per_line: 21
dev_set: [46, 171, 33, 3, 95, 119, 133, 135, 108, 152, 177, 181]
# Step0 预清理（默认不开，只对下面登记的页生效；坐标 = 原图像素）
preclean:
  151:
    - kind: horizontal_bar
      y0: 590        # 搜索窗，不是条本身 —— 条是斜的，窗内逐列自动定位
      y1: 730
      note: |
        正文上部压着一条横贯大半页的粗黑污渍条（x≈313-2002）。来自扫描源，
        不是本仓管线引入（git 最早的 cc8ad10cd8 版本已有）。看着像黑白反色，
        实测不是：纯纸列上条内墨占比 0.58-0.69、条外 0.24，反过来接缝也对不上。
        条是斜的（左端 y≈648，右端抬到 y≈601），所以给的是搜索窗不是固定上下沿。
        全书只有这一页正文里有（其余页的"暗带"都是上下版框，属正常墨）。

notes: |
  46/171/33 普通页；3 直线断处混碎片（曾误判最弯）；95/119 弯界行；133/135 浓墨粘连；
  108/152 文字带窗口救援页；177/181 无界行页（两翼闸后线挪进空缝）。
