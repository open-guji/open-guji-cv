# 《欽定四庫全書總目》武英殿刻本 卷首（IA 06061301.cn），vol02 —— 全书 186 页都是正文
id: vol02
title: 欽定四庫全書總目·卷首二（vol02）
edition: keben
raw_dir: data_full/zongmu/vol02
raw_pattern: "{page}.png"
expected_cols: 9
chars_per_line: 21
dev_set: [46, 171, 33, 3, 95, 119, 133, 135, 108, 152, 177, 181]
# Step0 预清理（默认不开，只对下面登记的页生效；坐标 = 原图像素）
preclean:
  151:
    - kind: inverted_band
      segments: [[293, 662], [725, 2002]]   # 带中间断开一处
      y_lo: 540        # 搜索窗
      y_hi: 780
      y_probe: 665     # 窗内一定落在带里的一行
      note: |
        正文上部横着一条粗带，带内**黑白是反的**（纸成黑、字成白）。不是墨污，
        是扫描/二值化在这一带翻了极性，所以修法是把带内整体反回来，字迹一笔不少。
        来自扫描源，不是本仓管线引入（git 最早的 cc8ad10cd8 版本已有）。
        边界是多段梯形：上沿从左到右一级级抬高 648→645→641→615→608→600，
        下沿基本平（693，最左一段 723），x 663-724 处断开。逐列用"列间纸列"量出。
        反色前带内墨占比 0.806，反色后 0.194（正文正常 0.152）；逐字核对整理本
        「真卿所見者四卷全本…傳寫者諱其殘缺因於書名增入卦爻二字」，所見/者/缺因 都对得上。
        全书只有这一页正文里有（其余页的"暗带"都是上下版框，属正常墨）。

notes: |
  46/171/33 普通页；3 直线断处混碎片（曾误判最弯）；95/119 弯界行；133/135 浓墨粘连；
  108/152 文字带窗口救援页；177/181 无界行页（两翼闸后线挪进空缝）。
