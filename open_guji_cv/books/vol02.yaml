# 《欽定四庫全書總目》武英殿刻本 卷首（IA 06061301.cn），vol02 —— 全书 186 页都是正文
id: vol02
title: 欽定四庫全書總目·卷首二（vol02）
edition: keben
raw_dir: data_full/zongmu/vol02
raw_pattern: "{page}.png"
expected_cols: 9
chars_per_line: 21
# 下版框跨页先验的基准（整册「页高 − 下版框 y」中位数），启用 Step1 下版框救援。
# 2026-09-12 用 measure_book_bottom_gap() 在全册 188 页上标定。换书要重标。
bottom_gap: 328.0
# 页级字格高的书级先验：闸2 估不出页级周期时兜底（空栏页栏内无字、推不出纵向节律）。186 页正文 113.0±2.37px。
# 2026-09-13 用 measure_book_period() 标定；只在估不出来时用，正常页一律用当场估的值。换书要重标。
period_prior: 113.0
dev_set: [46, 171, 33, 3, 95, 119, 133, 135, 108, 152, 177, 181]
# 命名页集（--pages <名字>）。dev_set 是切分链的分层集，历史数字都挂在它上面，别往里塞新页。
sets:
  # 夹注（雙行小注）专项集，2026-09-06 建，见 .claude/doc/jiazhu_plan_vol02.md。
  # 全书 70 页含夹注、75 段；本集 22 页覆盖：
  #   - T2 案語 10 页全部（4/5/9/13/20/24/30/31/36/100）——开放文本，最难；
  #   - T1 长短语 3 页（51/138/152「副都御史黃登賢家藏本」10 格）；
  #   - T1 单字尾 3 页（15/19/35，a 侧比 b 侧多一格的奇数字段）；
  #   - 其余补到 24 个不同 T1 短语各有一页代表。
  jz: [4, 5, 8, 9, 13, 15, 17, 19, 20, 24, 30, 31, 35, 36, 39, 45, 51, 66, 72, 100, 138, 152]
  # 下版框定位误差大专项集，2026-09-12 建（`border-detection/bottom-offset`
  # 整页坐标金标人工核对得出）：|整体偏差|>20px 或 |左右端斜率差|>15px 的页。
  # 不进 dev_set——vol02 的 dev_set 是切分链历史分层集，「别往里塞新页」（见上）。
  # 已知两种失败模式：搜索带边界锁死（`peak_line_search.find_horizontal_border`
  # 的 primary 卡在 band 边界）、被更强干扰特征压过真实版框线（次选纠偏的
  # ±60px 窗口/20% 得分阈值都不够用）——见 overview 项目
  # `图片初步数字化/进度/Step1-边框界行/01-下版框根修先造金标.md`。
  bottom_border_hard: [17, 22, 23, 25, 26, 27, 28, 29, 30, 51, 53, 58, 59, 60, 61, 64, 69, 70]
# 夹注（雙行小注）的本书文字约定。**探测夹注不看文字**（utils/jiazhu_split 纯几何），
# 这里只是「这一套书的注文长什么样」的书级先验；不配就整册按开放文本算，不会误判。
# 《欽定四庫全書總目》的版本注格式是「書名 + N卷 + 某某採進本／某某家藏本」。
jiazhu:
  note_suffixes: ["採進本", "家藏本", "藏本", "大典本", "進本", "刊本", "抄本",
                  "寫本", "進呈本", "刻本", "通行本", "敕撰本", "原本", "舊本"]
  note_max_len: 20
  # 书名与注文的分界：最后一个「N卷」或「無卷數」之后即注文
  title_split: "(?:[一二三四五六七八九十百千零〇]+卷|無卷數)"

# Step0 预清理（默认不开，只对下面登记的页生效；坐标 = 原图像素）
preclean:
  136:
    - kind: inverted_band
      segments: [[309, 1410]]
      y_lo: 385        # 搜索窗（带很薄，窗口给小一点，别把上下的界行卷进来）
      y_hi: 435
      y_probe: 409     # 窗内一定落在带里的一行
      ctx: 60          # 带上方到真版框只有 ~70px，ctx 给 170 会越过版框
      note: |
        正文上部一条**薄**反色带（y402-417，仅 16px）。2026-09-12 用户指出，此前
        两次误判为「上版框线」——教训见下。反色前带内墨占比 0.919，反色后 0.081。

        **为什么会误判成版框**：这页版面整体下沉约 110px（别的页上版框在 y≈290，
        这页在 y≈328），带又恰好落在版框下方 ~74px 的抬头空栏里——那一带本来就没字，
        于是「带上下两侧都要有字」这条判据量到上 0.08 / 下 0.05，被判成版框。

        **真正的判别特征（用户给的）：界行**。界行（列间竖线）在 x=325/875/1069/1268
        处**穿过这条粗线继续往上**，一直到 y≈328 才收——说明 328 那条细线才是上版框，
        402-417 这条粗线在**版框以内**，版框内不会有横贯的粗线，只能是缺陷。
        另两个佐证：带内「全黑行比例 = 0.00」（真版框线该接近 1.0）、
        带内字列「白占比 0.366」（黑底白字，极性反了）——最右的「龔」字被带切过，
        中间几笔就是白的。

        横向止于 x≈1410（右边「龔」字列之后的纸列全空，逐列查过 1420-1740 无带）。
  151:
    - kind: inverted_band
      segments: [[293, 662], [725, 2002]]   # 带中间断开一处
      y_lo: 540        # 搜索窗
      y_hi: 780
      y_probe: 665     # 窗内一定落在带里的一行
      note: |
        正文上部横着一条粗带，带内**黑白是反的**（纸成黑、字成白）。不是墨污，
        是扫描/二值化在这一带翻了极性，所以修法是把带内整体反回来，字迹一笔不少。
        来自扫描源，不是本仓管线引入（git 最早的 cc8ad10cd8 版本已有）。
        边界是多段梯形：上沿从左到右一级级抬高 648→645→641→615→608→600，
        下沿基本平（693，最左一段 723），x 663-724 处断开。逐列用"列间纸列"量出。
        反色前带内墨占比 0.806，反色后 0.194（正文正常 0.152）；逐字核对整理本
        「真卿所見者四卷全本…傳寫者諱其殘缺因於書名增入卦爻二字」，所見/者/缺因 都对得上。
        全书正文区只有 151/152 两页有（其余页的"暗带"都是上下版框，属正常墨；
        vol01 的 113/117 是职名页整列重复字，非污渍）。
  152:
    - kind: inverted_band
      segments: [[810, 2095]]
      y_lo: 560
      y_hi: 780
      y_probe: 678
      note: |
        与 151 同一处扫描故障的延续（151/152 正文相接）。带较薄：上沿 670→647 一级级抬高，
        下沿平在 690，横向 x 810-2095。反色后逐字对上整理本
        「周易要義十卷…宋魏了翁撰…僉書樞密院事」，要/義、宋/魏、院/事 笔画完整。
  153:
    - kind: inverted_band
      segments: [[655, 2035]]
      y_lo: 650
      y_hi: 850
      y_probe: 773
      ctx: 150
      smooth: 25
      note: |
        与 151/152 同一处扫描故障的延续（三页正文相接）。带更薄更淡：上沿 778→696
        一级级抬高，下沿平在 778，横向 x 655-2035。反色后逐字对上整理本
        「…飛伏之說…葢其大旨主於…漢學宋學之間故是編所錄…採掇謹嚴別裁精審…」，
        飛伏/大旨/間故/裁精 笔画完整。

notes: |
  46/171/33 普通页；3 直线断处混碎片（曾误判最弯）；95/119 弯界行；133/135 浓墨粘连；
  108/152 文字带窗口救援页；177/181 无界行页（两翼闸后线挪进空缝）。

