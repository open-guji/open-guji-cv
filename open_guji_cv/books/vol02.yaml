# 《欽定四庫全書總目》武英殿刻本 卷首（IA 06061301.cn），vol02 —— 全书 186 页都是正文
id: vol02
title: 欽定四庫全書總目·卷首二（vol02）
edition: keben
raw_dir: data_full/zongmu/vol02
raw_pattern: "{page}.png"
expected_cols: 9
chars_per_line: 21
dev_set: [46, 171, 33, 3, 95, 119, 133, 135, 108, 152, 177, 181]
# 命名页集（--pages <名字>）。dev_set 是切分链的分层集，历史数字都挂在它上面，别往里塞新页。
sets:
  # 夹注（雙行小注）专项集，2026-09-06 建，见 .claude/doc/jiazhu_plan_vol02.md。
  # 全书 70 页含夹注、75 段；本集 22 页覆盖：
  #   - T2 案語 10 页全部（4/5/9/13/20/24/30/31/36/100）——开放文本，最难；
  #   - T1 长短语 3 页（51/138/152「副都御史黃登賢家藏本」10 格）；
  #   - T1 单字尾 3 页（15/19/35，a 侧比 b 侧多一格的奇数字段）；
  #   - 其余补到 24 个不同 T1 短语各有一页代表。
  jz: [4, 5, 8, 9, 13, 15, 17, 19, 20, 24, 30, 31, 35, 36, 39, 45, 51, 66, 72, 100, 138, 152]
# 夹注（雙行小注）的本书文字约定。**探测夹注不看文字**（utils/jiazhu_split 纯几何），
# 这里只是「这一套书的注文长什么样」的书级先验；不配就整册按开放文本算，不会误判。
# 《欽定四庫全書總目》的版本注格式是「書名 + N卷 + 某某採進本／某某家藏本」。
jiazhu:
  note_suffixes: ["採進本", "家藏本", "藏本", "大典本", "進本", "刊本", "抄本",
                  "寫本", "進呈本", "刻本", "通行本", "敕撰本", "原本", "舊本"]
  note_max_len: 20
  # 书名与注文的分界：最后一个「N卷」或「無卷數」之后即注文
  title_split: "(?:[一二三四五六七八九十百千零〇]+卷|無卷數)"

# Step0 预清理（默认不开，只对下面登记的页生效；坐标 = 原图像素）
preclean:
  151:
    - kind: inverted_band
      segments: [[293, 662], [725, 2002]]   # 带中间断开一处
      y_lo: 540        # 搜索窗
      y_hi: 780
      y_probe: 665     # 窗内一定落在带里的一行
      note: |
        正文上部横着一条粗带，带内**黑白是反的**（纸成黑、字成白）。不是墨污，
        是扫描/二值化在这一带翻了极性，所以修法是把带内整体反回来，字迹一笔不少。
        来自扫描源，不是本仓管线引入（git 最早的 cc8ad10cd8 版本已有）。
        边界是多段梯形：上沿从左到右一级级抬高 648→645→641→615→608→600，
        下沿基本平（693，最左一段 723），x 663-724 处断开。逐列用"列间纸列"量出。
        反色前带内墨占比 0.806，反色后 0.194（正文正常 0.152）；逐字核对整理本
        「真卿所見者四卷全本…傳寫者諱其殘缺因於書名增入卦爻二字」，所見/者/缺因 都对得上。
        全书正文区只有 151/152 两页有（其余页的"暗带"都是上下版框，属正常墨；
        vol01 的 113/117 是职名页整列重复字，非污渍）。
  152:
    - kind: inverted_band
      segments: [[810, 2095]]
      y_lo: 560
      y_hi: 780
      y_probe: 678
      note: |
        与 151 同一处扫描故障的延续（151/152 正文相接）。带较薄：上沿 670→647 一级级抬高，
        下沿平在 690，横向 x 810-2095。反色后逐字对上整理本
        「周易要義十卷…宋魏了翁撰…僉書樞密院事」，要/義、宋/魏、院/事 笔画完整。
  153:
    - kind: inverted_band
      segments: [[655, 2035]]
      y_lo: 650
      y_hi: 850
      y_probe: 773
      ctx: 150
      smooth: 25
      note: |
        与 151/152 同一处扫描故障的延续（三页正文相接）。带更薄更淡：上沿 778→696
        一级级抬高，下沿平在 778，横向 x 655-2035。反色后逐字对上整理本
        「…飛伏之說…葢其大旨主於…漢學宋學之間故是編所錄…採掇謹嚴別裁精審…」，
        飛伏/大旨/間故/裁精 笔画完整。

notes: |
  46/171/33 普通页；3 直线断处混碎片（曾误判最弯）；95/119 弯界行；133/135 浓墨粘连；
  108/152 文字带窗口救援页；177/181 无界行页（两翼闸后线挪进空缝）。
