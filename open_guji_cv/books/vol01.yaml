# 《欽定四庫全書總目》武英殿刻本 卷首（IA 06061300.cn），vol01
id: vol01
title: 欽定四庫全書總目·卷首一（vol01）
edition: keben
raw_dir: data_full/zongmu/vol01     # 1-bit 扫描存成 PNG；与 rebuild_src 同源（未经任何预处理）
raw_pattern: "{page}.png"
expected_cols: 9
chars_per_line: 21
# 下版框跨页先验的基准（整册「页高 − 下版框 y」中位数），启用 Step1 下版框救援。
# 2026-09-12 用 measure_book_bottom_gap() 在全册 206 页上标定。换书要重标。
bottom_gap: 325.0
# 页级字格高的书级先验：闸2 估不出页级周期时兜底（空栏页栏内无字、推不出纵向节律）。108 页正文 115.0±1.67px。
# 2026-09-13 用 measure_book_period() 标定；只在估不出来时用，正常页一律用当场估的值。换书要重标。
period_prior: 115.0
# dev_set：固定的分层小页集，控制台默认对它跑。清楚页 / 抬头页 / 已知难页各取几张，
# 与 border-detection 金标页（14 页）和实审点名页有交集，便于对照。
# ⚠️ **只放正文页**（page_type == body）。原先混进过 vol01/119，它是**职名页**：
# 字大稀排、每列只有 7~19 字且逐列不同，用正文的「21 格」先验必然 9 列全灭，
# 每轮贡献 9 条假失败，把正文页的真实表现盖住了（看着 98/108，实际正文 98/99）。
# 已换成 21（同为三段折线弯页，9/9 有解）。见 doc/step3_error_survey.md 甲类。
dev_set: [24, 137, 141, 26, 33, 47, 42, 60, 70, 11, 21, 151]
notes: |
  24/137/141 普通清楚页；26/33/47 抬头页；42 竖直线两翼闸实锤页；60/70 截断实审页；
  11 顶端勾线 + 假线；21/151 弯界行（三段折线）。全部 page_type == body。

preclean:
  48:
    - kind: inverted_band
      segments: [[688, 1488]]
      y_lo: 330        # 搜索窗
      y_hi: 420
      y_probe: 365     # 窗内一定落在带里的一行
      note: |
        抬头字顶部一条反色带（黑白翻转），比正文起点更靠上，位置紧贴顶部版框，
        `scan_inverted_bands.py` 默认 --body 450,2600 会把它当版框噪声滤掉，
        --all 模式能扫到候选（y355-374，墨0.26）。覆盖列：御注/殊批/五朝/御批/列，
        「聖」字列右侧无带、笔画本身墨多，band_boundary 的纸列判据在此自然截止于
        x=1488，不需要额外分段。反色前带内墨占比 0.752，反色后 0.248
        （vol02 本底闸 BODY_INK_GATE=0.25，压线过闸；换册后本底分布未重新标定，
        仅供参考，见 preclean.py 模块说明）。反色后逐字核对：御注/殊批/五朝/御批/列聖，
        笔画完整，与相邻「聖義」列风格一致。
