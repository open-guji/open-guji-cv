# 管线骨架（2026-11-03，管线重组方案 B 第二期）：所有书共用的一条步骤顺序，`slot:` 是各套书自己换实现的位置。
# 三条链（keben_body_v2、modern_body、keben_free）的 yaml 只写「这套书在每个槽位里放哪几步」，
# 加载时（core/pipeline.load_pipeline）按这里的顺序展开成完整的 steps——共用的步骤只在这里写一遍，
# 新增一个共用 Step 不用再改三个 yaml，也不会再出现某条链漏掉 Step0 这样的偏差。
#
# 顺序必须是合法拓扑序（上游在前），展开后由 Pipeline.validate() 校验。边由各步 consumes / produces 推出。
# 下划线开头的文件不是管线（list_pipelines 不列）。
id: _skeleton
steps:
  - page_survey          # 1a 页面预检（原 Step0）：原图尺寸 → 按册中位数标异常页；闸在 border_detect_gate（任务卡 #54 第22条）
  - invert_detect        # 1a 反色带候选（原 Step0）：原图 → 疑似反色带（界行翻白）；只送审不自动修，人点头后进 preclean（2026-10-22）
  - slot: layout         # 1b 版框界行（原 Step1）：边框＋界行（殿本）／虚拟界行（现代）／分块（自由版式）
  - slot: seals          # 1c 印章定位：原图＋版框 → 每方印的类别与外框；只有刻本链有（后面各步认印只读它）
  - slot: columns        # 2a 单列拉直（原 Step2；11-22 起归 2 切字）：射影拉直（殿本）／裁列（现代）／块内找列（自由版式）
  - slot: cells          # 2b 逐字切分（原 Step3）：→ 带类型字格 + 读序
  - slot: recognition    # 2c–4b（原 Step4–7）：字框收缩、字形库匹配、生僻字、整理本对齐、上下文、放行（各套书同一份代码）
# 槽位缺省：没在链 yaml 里写的槽位用这里的值；`required` 里的槽位链 yaml 必须写。
slots:
  seals: []
  recognition:
    - cell_shrink        # 2c 字框收缩（原 Step4）：沿用 CharExtractor；→ 紧框 + flags；字块走缓存
    - glyph_match        # 3a 字形库匹配（原 Step5-a）：字块 → GlyphDB 三档判决 + 逐实例证据（指纹带库指纹）
    - glyph_near         # 3b 形近字组分析（2026-11-27）：触发了形近字组的格，按组登记的方法给组内各字新分；书配置 groups 空＝不跑
    - rare_candidates    # 生僻字候选（原 Step5-b）：字体模板 + CNN 分类/embedding 的 RRF 融合（needs=model）；将并进 3c glyph_candidate
    - glyph_candidate    # 3c 按图候选（2026-11-27，CV3）：r5 向量对全字表单路＋异体族展开，缺省关（enabled）
    - glyph_analyzer     # 3 识字收尾（2026-11-27）：汇总成 cands（字＋p＋证据）与 p_map；书配置 enabled 为假＝不跑
    - align_ref          # 3c 整理本对位（原 Step5-d）：文本证据一路，四路互相独立，排在 context_decide 之前（needs=corpus）
    - context_decide     # 4a 上下文（原 Step6）：库候选 + 上下文 → 门槛化定字（needs=corpus）
    - context_rank       # 按上下文排序（2026-11-27，CV3；候选字线所说的 4b）：候选按「图像分＋w·填空分」重排给卡片用，只排序不放行，缺省关（enabled）
    - seed_admit         # 4b 放行（原 Step7）：十条通道 → 自动进库 / 落回人审（needs=db；进库本身走 Event）
required: [layout, columns, cells]
# 四大步（2026-11-22 用户定，原九步里的 Step0–7 并成四步；Step8 入库、Step9 排版输出移到 guji-manager）。
# 切字内部分析用五小步 2a–2e（拉直、定字带左右边、列端字、字间切分、字框压缩），与 Step 的对应见 doc/2-切字/五小步.md。
# 只是分组：步骤 id、产物目录、指纹都不变。`guji pipeline … --from/--to` 可写大步名。
# 每个大步列它包含的步骤 id 或 `slot:<槽位>`（槽位里各链放的步骤都归这一大步）。
stages:
  layout: [page_survey, invert_detect, "slot:layout", "slot:seals"]                  # 1 版面：只管认位置、判类型（版框、界行、抬头、页型、印章）
  cut: ["slot:columns", "slot:cells", cell_shrink]                                   # 2 切字：单列拉直（射影、缩放）、字与框线分离、切字、缩框（2026-11-22 用户定）
  read: [glyph_match, glyph_near, rare_candidates, glyph_candidate, glyph_analyzer]                   # 3 识字：只管从字块图取证（2026-11-22 用户定）
  decide: [align_ref, context_decide, context_rank, seed_admit]                                     # 4 定字：整理本对位归这里（不读字块图，合文本与字形证据）
# 大步收尾（2026-11-27 用户定）：每个大步可以有一个收尾步骤，在本大步其他步骤之后、下一大步之前跑，
# 汇总本大步各小步的结果。收尾必须是本大步在管线里的最后一步（加载时校验）。不是每个大步都要有。
finals:
  read: glyph_analyzer
