# 刻本正文（v2 切分链）—— 本设计唯一建模的链。
# 顺序必须是合法拓扑序（上游在前）；边由各步 consumes / produces 推出。
# 2026-10-18（sheldon 定）：删掉 Step5-c `ocr_candidates` 与 Step6b `group_decide` 两步。
#
# 2026-09-09：Step2→3 交接闸（column_gate）不再是独立节点——它不产出新内容，
# 只判定 column_warp 的输出够不够格进 row_segment，现在挂在 column_warp 的
# `StepSpec.gate` 上（见 open_guji_cv/gates/column_gate.py），引擎跑完
# column_warp 会自动接着跑它；`row_segment` 仍然 consumes `gate_manifest`，
# 拓扑上这条边由 core/pipeline.py 认闸产出的种类，不需要闸出现在下面的列表里。
id: keben_body_v2
title: 刻本正文（v2 切分链）
selector:
  edition: keben
  page_type: [body]
# 骨架 pipelines/_skeleton.yaml；这里只写本链在每个槽位里放哪几步（2026-11-03 方案 B 第二期）。
slots:
  layout: [border_detect]   # Step1 边框探测：原图 → 版框 + 界行（含折线）+ 外框 + 抬头框
  seals: [seal_detect]      # 印章定位：原图＋版框 → 每方印的类别（大印/小印）与外框，大印按版框定成正方形（2026-10-22）
  columns: [column_warp]    # Step2 单列射影 + 去噪 + 界行/版框清除：→ warp 参数 / 文字带 / border_class；列图走缓存；出口闸见上
  cells: [row_segment]      # Step3 单列文字切分：→ 带类型字格 + 读序
  # recognition 用骨架缺省（Step4–7）。2026-09-10 align_ref 去掉对 context_decision 的依赖，四路互相独立
notes: |
  坐标：Step1 产物存规范空间 raw_page_px@top-right；Step2–4 的列内坐标是 column_px，
  另带回到原图的 quad_page / bbox_page。
