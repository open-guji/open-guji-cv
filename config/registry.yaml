# cv config/ 文件登记（整改清单 X7，CV0 2026-11-28）
# 每条管 config/ 下一个文件或一个目录（目录以 / 结尾，管其下全部文件）。守卫：tests/test_config_registry.py
#   —— config/ 下每个进 git 的文件都要被某条管到；每条都至少管到一个文件。
# 字段：
#   scope  通用 | 来自书:<书> | 应归组:<组> | 历史 | 待查
#          「来自书」= 从某部书的数据得出、别的书照用不一定对；「应归组」= 以后搬进该组；「待查」= 来源说不清，由负责线补
#   readers  读它的代码（证据）
#   owner    负责线
#   todo     要做的事（没有就不写）
