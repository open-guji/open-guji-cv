schema: ctx_l1/1
group: ts
# 土士 L1：士远多于土（本册整理本约 534:23），所以规则要对「土」同样严——凡可能是「土X」的词（土官、土人）一律不给字。
rules:
  - {id: ts-進士, char: 士, src: hand, re: '進◎', note: 進士}
  - {id: ts-學博士, char: 士, src: hand, re: '[學博碩處隱術方道名志武儒貢紳]◎', note: 學士、博士、處士、隱士、道士、方士、術士、名士…}
  - {id: ts-士大夫, char: 士, src: hand, re: '◎大夫', note: 士大夫}
  - {id: ts-士林, char: 士, src: hand, re: '◎(?:林|子|女|卒|衆|類|習)', note: 士林、士子、士衆；「士卒」}
  - {id: ts-土地風, char: 土, src: hand, re: '◎(?:地|產|宜|司|俗|音)|[疆風國水沃邊領黃紅泥]◎(?!官)', note: 土地、土產、土宜、土司、疆土、風土（后接「風」不收：「士風」是词）、國土、水土、領土；「中土」不收（會與「中士」混）}
