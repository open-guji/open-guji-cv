schema: ctx_l1/1
group: zw
# 丈文 L1：文远多于丈（史記 r36 十册参校本约 749:57）。丈只收「数词＋丈＋尺／餘／許」「丈尺」「丈夫人」「方丈（瀛／壺）」这类度量与固定词；
# 两可的「三丈／二丈」后接别字不收（三文王、二文公也成词）。文只收「文＋章字獻集學史…」「天文、人文、古文…＋非数字」。
# 全部规则在史記 01–10 册 r36 参校本上下文 806 格（丈 57、文 749）回测零冲突（2026-11-11，A24）。
rules:
  - {id: zw-丈量, char: 丈, src: hand, re: '[一二三四五六七八九十百千數餘]◎(?:[一二三四五六七八九十]?尺|餘|許|有[一二三四五六七八九十])', note: 数＋丈＋尺／餘／許（十丈餘、三丈五尺）}
  - {id: zw-丈尺人, char: 丈, src: hand, re: '◎(?:尺|夫人|人[^一-鿿]|人$)', note: 丈尺、丈夫人、丈人}
  - {id: zw-方丈, char: 丈, src: hand, re: '方◎(?:瀛|壺)', note: 方丈瀛洲、方丈壺梁}
  - {id: zw-文詞, char: 文, src: hand, re: '◎(?:章|字|獻|集|學|史|選|心|帝|王|公|宗|淵|苑|辭|詞|義|理|法|物|武|教|質|采|德|言|藻)', note: 文章、文字、文獻、文帝、文王、文公、文宗…}
  - {id: zw-天人文, char: 文, src: hand, re: '(?:天|人|古|詩|屬|作|碑|序|經|本|其|此|斯|行|成|奏|策|散|駢)◎[^一二三四五六七八九十]', note: 天文、人文、古文、詩文、碑文、經文（后接数字不收，如「其文二十」仍可能是丈）}
