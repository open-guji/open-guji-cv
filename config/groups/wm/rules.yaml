schema: ctx_l1/1
group: wm
# 未末 L1：只在把握十足时给字。手写词组（本末/始末/末流/未嘗/未見…）与干支纪年。
# 整理本在这两字上有零星互讹，所以每条规则都在本册整理本上逐条对账（research/m7/ctx/ext_l1_check.py），
# 与整理本字冲突的格逐格看过窗口再决定留不留规则。
rules:
  - {id: wm-干支未, char: 未, src: hand, re: '(?<![甲乙丙丁戊己庚辛壬癸])[乙丁己辛癸]◎', note: 地支「未」配乙丁己辛癸（乙未丁未己未辛未癸未）；前面不能再是天干（天干序列「丙丁戊己」里的末位是天干）}
  - {id: wm-始末, char: 末, src: hand, re: '始◎', note: 始末}
  - {id: wm-卷末, char: 末, src: hand, re: '[卷篇簡]◎', note: 卷末、篇末、簡末（「書末」「序末」会与「書未焚」「序未」混，不收）}
  - {id: wm-斷代末, char: 末, src: hand, re: '(?:宋|元|明|金|唐|漢|晉|隋|周|魏|齊|梁|陳|清|季|叔)◎[年世葉季人儒]', note: 「明末」「宋季」式；限定后接字，避开「明未…」类虚词}
  - {id: wm-末流學葉, char: 末, src: hand, re: '◎[流學葉簡派技節]', note: 末流、末學、末葉、末簡、末技、末節}
  - {id: wm-附末, char: 末, src: hand, re: '◎附', note: 末附（附於篇末）}
  - {id: wm-本末, char: 末, src: hand, re: '[探究窮溯]本◎|(?<!原)本◎[具兼備詳]', note: 本末（探本末、本末具備）；「原本未」是「原本＋未」，故排除}
  - {id: wm-未虛詞後接, char: 未, src: hand, re: '◎(?:見|免|嘗|能|及|詳|可|必|成|盡|發|備|審|濟|足|聞|竟|知|得|敢|睹|經|遑|暇|遂|審|確|刊|刻|梓|之見|悉|可知|幾|幸)', note: 未見、未免、未嘗、未能…；虚词「未」}
  - {id: wm-未前置, char: 未, src: hand, re: '(?:所|皆|猶|雖|偶|尚|尙|亦|則|固|葢|蓋|似|並|均|仍|殆|恐|終|竟|殊)◎', note: 所未、皆未、猶未、雖未、尚未、亦未、而未、則未}
  - {id: wm-否決-之末, char: null, re: '[乙丁己辛癸]◎[年]', note: 干支「X未年」在上条之外不再给末；本条否决不影响干支未规则（规则先判否决，所以放最后一道护栏——见下说明）}
