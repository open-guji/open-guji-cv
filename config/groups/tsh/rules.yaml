schema: ctx_l1/1
group: tsh
# 塡愼 L1：只收词组唯一的；其余交 L3（`prompt.md`）按文意定。整理本与文意不同时不补放（flow `lift_ref_agree`）。
rules:
  - {id: tsh-塡-填詞, char: 塡, src: hand, re: '◎(?:詞|補|寫|塞|海|滿|委|溢|街|咽|然|充|空)', note: 填詞、填補、填寫、填塞、填海、填滿}
  - {id: tsh-愼-謹慎, char: 愼, src: hand, re: '(?:謹|戒|不|用|崇)◎|◎(?:獨|重|思|終|行|到|懋賞|微|言|選|密|子)', note: 謹慎、戒慎、慎獨、慎重、慎到、唐慎微}
