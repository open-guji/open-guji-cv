schema: ctx_l1/1
group: rm
# 日目 L1：与 ry（日曰）共用「日」字（登记表 overlaps）。只收无歧义词组；「目錄／日錄」「書目／書日」类两可的弃权。
# 日目曰三字联合判（ry 说日、rm 也须说日）：本组规则只收「曰」进不来的词组；vol11–20 回测见 research/char_groups/ry/verify_1024。
rules:
  - {id: rm-目, char: 目, src: hand+A24-1024, re: '(?:綱|細|總|存|耳|門|眉)◎(?![月食也])|◎(?:睹|擊|的|光|次)', note: 綱目、細目、總目、存目、耳目、門目、眉目、目睹、目次。A24 10-24 去掉子名題篇標條節科類（子曰、名曰、題曰在 vol11–20 是子目名目題目的 7 倍）和右邊的下前力（曰下、曰前也有）}
  - {id: rm-日, char: 日, src: hand+A24-1024, re: '(?:昔|累|終|每|竟|逐|旬|半|連)◎|◎(?:晷|蝕|夜)|(?<![一二三四五六七八九十])◎[月食]', note: 終日、每日、日月、日食、日晷。A24 10-24 去掉今是他前後數（今曰、是曰、他目、數目都有）、◎久（句末目接下句久）；「一曰月令」的◎月不收}
  - {id: rm-否決-排比曰, char: null, src: A24-1024, re: '曰[^日曰]{1,3}◎[^日曰]{1,3}曰', note: 兩側 1–3 字外都是「曰」的排比位多是曰（「曰危行曰食功」），交 ry 判，rm 弃权}
