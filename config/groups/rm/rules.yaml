schema: ctx_l1/1
group: rm
# 日目 L1：与 ry（日曰）共用「日」字（登记表 overlaps）。只收无歧义词组；「目錄／日錄」「書目／書日」类两可的弃权。
rules:
  - {id: rm-目, char: 目, src: hand, re: '(?:綱|條|子|細|篇|標|總|存|題|耳|科|節|名|門|類|眉|條)◎(?![月食])|◎(?:睹|擊|的|下|前|光|力|次)', note: 綱目、條目、子目、標目、總目、存目、題目、耳目、眉目、目睹、目下（「目錄」「次日」类两可不收）}
  - {id: rm-日, char: 日, src: hand, re: '(?:今|是|他|昔|前|後|累|終|每|竟|逐|旬|半|數|連)◎|◎(?:月|食|晷|蝕|夜|久)', note: 今日、是日、他日、終日、日月、日食、日晷（「前目／後目」也不成词，故前後日可收）}
