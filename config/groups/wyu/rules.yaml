schema: ctx_l1/1
group: wyu
# 王玉 L1：王（人名、帝王）远多于玉。只收词组把握十足的。
# 2026-10-26 A24「压低王玉送审」：97 册（vol02–99，不含 vol06）逐条核对，去掉有反例的前后字——
#   宋◎（宋玉）、唐◎（唐玉潛）、齊◎（啟齊玉蘇）、魯◎（字魯玉）、晉◎（王晉玉）、列◎（列玉靈）、大◎（大玉帳、周必大玉蕋）、
#   ◎樵（字玉樵）；金◎（金王庭筠等）、白◎（李白王維）、琬◎（汪琬王士禎）、寶◎（干寶王肅）、◎石（王石和）。
#   文◎ 不收「董文◎」「文◎屑」，帝◎ 不收「帝◎闕」；◎堂 不收「爲◎堂」（訛玉堂爲王堂），◎海 不收「二◎海」（二王海上），◎臺 不收「吳◎臺」。
#   補：「…本宋王某撰」著者行、王叔和 王羲之 等人名、宋玉（屈原宋玉、宋玉九辨…）、金王庭筠等人名、梁惠王、白玉蟾。◎音 有王音（人名）反例，不收。
rules:
  - {id: wyu-人名, char: 王, src: hand, re: '◎(?:弼|肅|夫之|宏撰|懋竑|應麟|安石|守仁|陽明|廷相|鳴盛|引之|念孫|昶|通|充|符|褒|嗣|庭筠|若虛|若虚|處一|士禎|士禛|維|昌齡|摩詰|克貞|叔和|羲之|禹偁|元感|聿鍵|十朋|欽若|明淸|安中|象之|銍)|應帝◎|惠◎|金◎(?=寂|嘉)|(?<!董)文◎(?!函|堂|帛|篇|海|臺|墀|屑)|帝◎(?!函|堂|帛|篇|海|臺|墀|闕)|(?:武|先|周|魏|漢|諸|藩|親|郡|燕|楚|趙|秦)◎(?!函|堂|帛|篇|海|臺|墀)', note: 王弼、王肅、王應麟、王維、金王庭筠、梁惠王、文王、武王、先王、帝王、燕王…（玉函、玉堂、玉帛、玉篇、玉海、玉臺、玉屑、玉闕不收；宋 唐 齊 魯 晉 列 大 後不收）}
  - {id: wyu-玉器, char: 玉, src: hand, re: '吳◎墀|◎(?:函|帛|壺|屑|蟾)|(?<![爲作])◎堂|(?<!二)◎海|(?<!吳)◎臺|(?:珠|璧|琬琰|琰|琢|美|瑞)◎(?!弼)', note: 玉函、玉堂、玉篇、玉海、珠玉、白玉蟾（金 白 寶 琬 後不收）}
  - {id: wyu-宋玉, char: 玉, src: hand, re: '(?:屈原|荀卿|荀况|追)宋◎|宋◎(?:九辨|招魂|景差|高唐|神女|風賦|釣賦|大言|宅|舊宅|諸篇|以下|荀卿|工賦|賦|之賦|對楚|下迄)', note: 宋玉（楚辭作者）：屈原宋玉、宋玉九辨、宋玉高唐賦…}
  - {id: wyu-著者行, char: 王, src: hand, re: '(?:本|題|^)(?:宋|明|唐|元|金|晉|南宋|北宋)◎[^\s□◎]{1,2}(?:撰|編|註|注|輯)', note: 著者行「某某採進本宋王質撰」「舊本題唐王冰撰」（朝代前接 本／題，排除 陳玉輝撰 這類姓陳名玉）}
