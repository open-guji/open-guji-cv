# 王玉 L1：王（人名、帝王）远多于玉。只收词组把握十足的。
rules:
  - {id: wyu-人名, char: 王, src: hand, re: '◎(?:弼|肅|夫之|宏撰|懋竑|應麟|安石|守仁|陽明|廷相|鳴盛|引之|念孫|樵|昶|通|充|符|褒|嗣)|應帝◎|(?:文|武|先|帝|周|魏|漢|唐|宋|諸|藩|親|郡|列|大|魯|燕|楚|齊|趙|晉|秦)◎(?!函|堂|帛|篇|海|臺|墀)', note: 王弼、王肅、王夫之、王應麟、文王、武王、先王、帝王、魯王、燕王…（玉函、玉堂、玉帛、玉篇、玉海、玉臺不收）}
  - {id: wyu-玉器, char: 玉, src: hand, re: '吳◎墀|◎(?:函|堂|帛|海|臺|壺|屑|石)|(?:金|珠|寶|璧|琬|琰|琢|白|美|瑞)◎(?!弼)', note: 玉函、玉堂、玉篇、玉海、金玉、珠玉、寶玉、白玉}
