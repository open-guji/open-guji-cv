schema: ctx_l1/1
group: zh
# 曾會 L1：會（會典、會試、附會、適會）多于曾。「曾有／會有」「曾見／會見」「曾為／會為」「未曾／未會」这类两可的不给字。
rules:
  - {id: zh-曾氏, char: 曾, src: hand, re: '◎(?:子固|子曰|鞏|參|氏|孫|祖|國藩|慥|幾|紆|丰|肇|公亮|三異)|何◎', note: 曾子固、曾鞏、曾參、曾氏、曾孫、曾祖、何曾}
  - {id: zh-曾經, char: 曾, src: hand, re: '◎(?:經|未|不|無)', note: 曾經、曾未、曾不、曾無}
  - {id: zh-會典, char: 會, src: hand, re: '◎(?:典|要|試|稽|盟|議|意|計|粹|元|編|聚)', note: 會典、會要、會試、會稽、會盟、會議、會意、會計、會粹、會元、會編、會聚（會同／會合／會通不收：「曾同」姓氏連書）}
  - {id: zh-附會, char: 會, src: hand, re: '(?:附|融|領|理|體|機|牽合附|穿鑿附|貫通融)◎', note: 附會、融會、領會、理會、體會、機會}
