schema: ctx_l1/1
group: dt
# 大太 L1：大远多于太（整理本约 1450:310）。太只收官名、帝号、术语类固定词；两字都可能成词的（大史／太史、大守／太守、大祖／太祖、大宰／太宰、大平／太平、大原／太原、大常／太常、大傳／太傳、大略／太略、大過／太過）一律不给字（无规则命中即弃权）。
rules:
  - {id: dt-太極, char: 太, src: hand, re: '◎(?:極|玄|乙|歲|素)', note: 太極、太玄、太乙、太歲、太素（太初／太始／太易不收：「大易」等也成词）}
  - {id: dt-太帝號, char: 太, src: hand, re: '◎(?:宗皇帝|祖高皇帝|祖皇帝|上皇|后|廟)|皇◎(?:后|子)|(?:宋|唐|魏|晉|周|漢|金|遼|明|清|隋)◎(?:祖|宗)', note: 太宗皇帝、太祖皇帝、皇太后、宋太祖…（「元大祖」不收）}
  - {id: dt-太史公, char: 太, src: hand, re: '◎史公', note: 太史公}
  - {id: dt-太醫, char: 太, src: hand, re: '◎(?:醫|僕|保|師|學生|常卿|常寺|僕寺)', note: 太醫、太僕、太保、太師、太常寺（太傅不收：「謝太傅」ok 但「大傳」混）}
  - {id: dt-太子, char: 太, src: hand, re: '(?:皇|東宮|廢|立)◎子|◎子(?:太|少)?(?:傅|保|師|賓客|少)', note: 皇太子、太子少傅}
  - {id: dt-大學, char: 大, src: hand, re: '◎(?:學士|學之道|學衍義|學章句|學或問|旨|抵|義|意|指|要|約|致|都|概|小|夫|全|成|有|壯|畜|衍|中|同|辟|司馬|司寇|司徒|司空)|(?:易|卦)◎過', note: 大學、大旨、大抵、大義、大意、大指、大要、大約、大致、大都、大概、大小、大夫、大全、大成、大有、大壯、大畜、大衍、大同、大辟（大易不收：太易也成词）、大司馬；易大過}
  - {id: dt-大副詞, char: 大, src: hand, re: '(?:甚|極|最|尤|偉|廣|博|宏|洪|重|巨|盛|丕|鉅|弘|寬)◎(?![原倉學常守史])', note: 甚大、極大、偉大、廣大、博大、宏大、洪大、重大、巨大、盛大；「官至太常／太原」不收}
