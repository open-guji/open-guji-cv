schema: ctx_l1/1
group: jys
# L1 规则集（D3）：先收编现有规则路 `utils.ji_yi_si_clf.classify`（行为逐格不变，tests/test_groups_ctx_l1.py 对拍）。
# 其上新增的规则：理由与证据见 doc/design/M7-分块-D-上下文L1.md。语料（總目校对本）里己已巳互讹严重
# （「以己意」写成「以巳意」52 次、「已著」写成「巳著」744 次），所以语料纯度只作线索，每条都要在强真值上 0 错且文意站得住。
legacy: open_guji_cv.utils.ji_yi_si_clf:classify
rules:
  - {id: jys-已+不有稱先屬在言引別别編全入改, char: 已, src: mined+hand,
     re: '(?<![自克捨推恕律責由屈知利異甲乙丙丁戊己庚辛壬癸而])◎[不有稱先屬在言引別别編全入改]',
     note: 已＋虚词/动词（已不、已有、已稱…）；语料后字为这些字时「己」0 次（n≥15）；前字不是「自己/克己」类}
  - {id: jys-已著, char: 已, src: mined+hand, re: '(?<![自克捨推恕律責由屈知利異甲乙丙丁戊己庚辛壬癸而])◎著', note: 已著錄；语料 2519:12}
  - {id: jys-而已, char: 已, src: hand+user-2026-10-17, re: '而◎(?=[矣也乎哉耳焉□]|$)', note: 「而已」（10-24 A24 收窄到句末：后字是语气词、□或窗口尽头；「而◎」接谓语时常是主语「己」，交文意表）。强真值 28 格全是已（含一格原金标误标为己，已由 sheldon 复审改正）；用户 10-17 确认大多确定}
  - {id: jys-己易書名, char: 己, src: hand+user-2026-10-17, re: '(?<!而)◎易(?=[一二三四五六七八九十]+卷)|[楊杨]簡之◎易', note: 書名《己易》（楊簡）；用户 10-17 点名。「而已易…」由 jys-而已先接}
  - {id: jys-年號己巳, char: 巳, src: hand, re: '(?:熙|定|治|德|靖|厯|曆|歷|隆|慶|禎|豐|光|祐|興|寧|和|武|泰|化)[己已巳]◎',
     note: 年號末字＋己＋◎＝干支「己巳」的巳（康熙己巳、嘉定己巳）。legacy 的「前天干→巳」不认前字是己（怕是「自己」），年號在前就没这层顾虑。中间字也认已／巳：组流窗口取组流前的放行字，被本组改字的邻格还是原字（vol06:125「嘉定己巳」）。中间是 □ 不认：参考文本里「年號＋未知＋◎」常是「歷年已久」「皇慶中已」。參考文本命中 10 次全是巳}
