schema: ctx_l1/1
group: yt
# 圓圖 L1：圖（河圖、圖書、圖說）远多于圓。圓只收「圓通／圓滿／渾圓」等无歧义词组；「方圓／圓圖」类两字都成词的弃权。
rules:
  - {id: yt-圖, char: 圖, src: hand, re: '易◎明辨|(?:河|地|輿|星|版|海|繪|附)◎(?!方|橫|横|直|周|滿)|◎(?:書|說|譜|像|志|籍|贊|讚|畫|經|考|解)', note: 河圖、地圖、輿圖、附圖、圖書、圖說、圖譜、圖像、圖經（「圖象」「圖考」亦圖）}
  - {id: yt-圓, char: 圓, src: hand, re: '◎(?:滿|融|轉|活|熟|明園|寂|周|形|頂|光)|(?:渾|團|周|正|半|大)◎(?!圖|說)', note: 圓通、圓滿、圓明、渾圓、團圓（「卦圓圖」弃权）}
