# 入人八 L1：只用外部语料（殆知阁）纯度≥0.99、n≥25 的单侧键。手写的「◎卦→八」等试过：增【入】卦爻、列【八】卦这类
# 反例让它做不到 100%，不收。外部右字键「◎知/才/能…→人」在本书里 8/124 错（入、八后面也常接这些字），剔除。生成/审计见 research/m7/ctx/gen_rules.py。
# A24 2026-10-25：全书整理本回测，rr-ext-l1-人 聖 家 刑 賢 改為前不接 天／國／提恤／集，去 族窮梓英友某旁遠（天聖八年、國家八旗、恤刑八目、提刑入直、皇族八曰、辯窮八曰、先梓八卷、文英八卷、集賢八登、孝友入、某入海、旁入、仇遠入元），rr-ext-l1-八 去 隆（景運方隆人文）。
# A24 2026-10-24：下线 rr-ext-r1-八——整理本挖出的搭配规则，拿 vol11–20 整理本回测（规则没见过的册）有冲突，不满足「零冲突」；产物里它们造成的都是误降审（看图核过）。明细见 A24 项目文件 a24/yiti/。
rules:
  - {id: rr-ext-l1-人, char: 人, src: external-pure, re: '(?:[舍他庶殺鄉寡咥的愛養昔幽擇奸庖殷惑貧碩育毆佞僕鄰救淑凌勵俄閒哲假醢沖孺農誨恤]|(?<!天)聖|(?<!國)家|(?<![提恤])刑|(?<!集)賢)◎', note: 外部语料 l1→人；n≥25 纯度≥0.99}
  - {id: rr-ext-l1-入, char: 入, src: external-pure, re: '[混竄]◎', note: 外部语料 l1→入；n≥25 纯度≥0.99}
  - {id: rr-ext-l1-八, char: 八, src: external-pure, re: '[尺寸閏緒]◎', note: 外部语料 l1→八；n≥25 纯度≥0.99}
  - {id: rr-ext-r1-入, char: 入, src: external-pure, re: '◎[朔]', note: 外部语料 r1→入；n≥25 纯度≥0.99}
