schema: ctx_l1/1
group: ly
# 論諭 L1：論（議論、評論）远多于諭（诏諭、上諭）。只收词组把握十足的；「論曰／諭曰」「論旨／諭旨」类两字都成词的一律不给字。
rules:
  - {id: ly-論語, char: 論, src: hand, re: '◎(?:語|衡|斷|定|贊|辨|辯|說|難|列|述|證)|(?:議|評|立|持|無|不|公|概|總|史)◎(?![旨令])', note: 論語、論衡、議論、評論、立論、持論、無論、不論、總論…（「通論／之論／其論」不收：「通諭」「之諭」也成词）}
  - {id: ly-篇名, char: 論, src: hand, re: '(?:鹽鐵|潛夫|新|博|辯|辨)◎', note: 鹽鐵論、潛夫論、新論、博論等書名篇名}
  - {id: ly-諭旨, char: 諭, src: hand, re: '(?:欽奉|恭奉|欽遵|欽承|奉|頒|降|傳|下|頁|奉到)◎旨|上◎(?:曰|云|以|令|內|開|旨)|◎(?:旨|令|祭|葬|德|示|告)', note: 諭旨、上諭、諭令、諭祭、諭德}
  - {id: ly-曉諭, char: 諭, src: hand, re: '(?:曉|詔|敕|聖|面|宣|飭|誥|恩|手)◎(?!語)', note: 曉諭、詔諭、敕諭、聖諭、面諭、手諭（「傳諭／訓諭／告諭」不收：「傳論」「伊訓論」等篇名也成词）}
  - {id: ly-否決-論旨, char: null, re: '[議評立持]◎旨', note: 「論旨」成词（議論旨…），不给}
