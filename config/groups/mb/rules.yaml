  - {id: mb-本-古經, char: 本, src: hand, re: '古◎(?![竹老])|(?<!以)二◎|(?<!皓)◎經', note: A24 10-25 從 l1／r1 拆出，避開 古木竹石、古木老成人、架以二木、喻皓木經；vol20:204:2:13「凡有二本」整理本誤作木（vol16:75:3:16 古本、vol07:79:1:4 據水經注被放成木，靠它降審）}
