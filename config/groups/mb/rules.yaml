# A24 10-25：全书整理本（光盘版）回测，l1 去 子爲與有二古、r1 去 國所經一又（古、二、經 改為帶例外的 mb-本-古經）（字子木、爲木鐸、與木谷、有木石居士、古木竹石；陳木國子監、周木所集、喻皓木經、沈木一事、士木又）；另加否决 mb-否決-木。
rules:
  - {id: mb-本-l1, char: 本, src: corpus-pure, re: '[進藏此舊原今典史傳易疏書刋弼僞定學别多經善監注葢所]◎', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: mb-本-l2, char: 本, src: corpus-pure, re: '(?:採進|家藏|府藏|朱子|大典|明史|注疏|易之|卷此|本舊|宋史|王弼|無傳|閣藏|周易|與此|錢一)◎', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: mb-本-r1, char: 本, src: corpus-pure, re: '◎[明義傳不元也㫖題其以無舊故文惟亦十有作者乃末卦僅意皆古同與]', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: mb-本-r2, char: 本, src: corpus-pure, re: '◎(?:國朝|義爲|傳是|舊本|不著|明陳|義而|明朱|明王)', note: 整理本奇偶册交叉验证零冲突；n≥8}
