# A24 2026-10-24：下线 em-而-l1、em-而-r1——整理本挖出的搭配规则，拿 vol11–20 整理本回测（规则没见过的册）有冲突，不满足「零冲突」；产物里造成误降审（看图核过），em-而-r1 还错放过一格（vol12:123:5:15「四面有章」放成而）。明细见 A24 项目文件 a24/yiti/。
rules:
  - {id: em-而-l2, char: 而, src: corpus-pure, re: '(?:之說|爲主|爲宗|本義|於前|之義|之名|爲經|之學|之言|之書|義理|象數)◎', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: em-而-r2, char: 而, src: corpus-pure, re: '◎(?:不載|此書|不言|參以|不可|無所|不及|不能|斷以|不知)', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: em-面-hand, char: 面, src: hand, re: '[東南西北]◎(?=[設立獻薦])|(?:(?<![銖句兩])兩|軫|蔽)◎(?![而不])|◎縛', note: 方位面（南面、東面）、四面、兩面、軫面、蔽面、面縛（A24 10-25：銖兩而、銖銖兩兩而、字銖句兩而 不算）}
  - {id: em-否決-換面, char: null, src: hand, re: '換◎', note: A24 10-25 全書整理本回測：改頭換面不可究詰（em-而-r2 ◎不可）}
