schema: ctx_l1/1
group: em
rules:
  - {id: em-而-l1, char: 而, src: corpus-pure, re: '[說書義傳經文本主卷易象理名學圖變卦意同數是宗序字錄見家事合得前明法中篇疏年例條言一此注時人下舉上目多博心者失通極氏也推後句解類異入語作因來爻存]◎', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: em-而-l2, char: 而, src: corpus-pure, re: '(?:之說|爲主|爲宗|本義|於前|之義|之名|爲經|之學|之言|之書|義理|象數)◎', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: em-而-r1, char: 而, src: corpus-pure, re: '◎[不以無後作非言爲已巳所於成又有易未推此實止一附亦存自參大論經謂發變皆上雜義斷可去三取集終卒談失歸下生分始深從書繫先反]', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: em-而-r2, char: 而, src: corpus-pure, re: '◎(?:不載|此書|不言|參以|不可|無所|不及|不能|斷以|不知)', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: em-面-hand, char: 面, src: hand, re: '[東南西北]◎(?=[設立獻薦])|(?:兩|軫|蔽)◎(?![而不])|◎縛', note: 方位面（南面、東面）、四面、兩面、軫面、蔽面、面縛}
