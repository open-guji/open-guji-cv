schema: ctx_l1/1
group: wxs
# 戊戌戍 L1：干支（戊天干；戌地支）与「戍守」。只在把握十足时给字。
rules:
  - {id: wxs-地支戌, char: 戌, src: hand, re: '(?<![甲乙丙丁戊己庚辛壬癸])[甲丙庚壬戊]◎(?![己庚辛壬癸])', note: 地支「戌」配甲丙戊庚壬（甲戌、丙戌、戊戌、庚戌、壬戌）；排除前面还是天干（天干序列）、后面又接天干的情形}
  - {id: wxs-戊配支, char: 戊, src: hand, re: '(?<![甲丙庚壬戊])◎[子寅辰午申]', note: 天干「戊」配子寅辰午申（戊子戊寅戊辰戊午戊申）；前面不能是甲丙庚壬戊（那样本字是地支）}
  - {id: wxs-天干序列, char: 戊, src: hand, re: '丁◎己', note: 天干序列丁戊己}
  - {id: wxs-戍守, char: 戍, src: hand, re: '[謫遣征衛屯]◎|◎[守卒邊役兵]', note: 戍守、戍邊、戍卒、謫戍、衛戍}
