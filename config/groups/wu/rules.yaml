schema: ctx_l1/1
group: wu
# 嗚鳴 L1（全唐文 QTW，2026-11-13，A31 受 Ops 转）：看图分不开本书嗚的刻形和库里鳴的刻例，只能靠文意。
# 嗚只收叹词与哭声：嗚呼／嗚乎／嗚咽／嗚嗚／喑嗚／鳴→不收。鳴只收「鳥獸蟲聲、樂器聲、鳴＋器物／鳥名」这类固定词。
# 「鳴呼」是嗚呼的异写，本组按 QTW 口径（整理本、参校本作嗚）一律定嗚，不收进鳴。
# 两可的「鳴＋非上列字」「X＋鳴」不收，弃权交 L2/L3。规则在 QTW m2 层4 的 130 格（嗚呼／嗚乎／嗚咽／喑嗚 123 格）上应全给嗚。
rules:
  - {id: wu-嗚呼, char: 嗚, src: hand, re: '◎(?:呼|乎|咽|嗚|哉)', note: 嗚呼、嗚乎、嗚咽、嗚嗚、嗚哉}
  - {id: wu-喑嗚, char: 嗚, src: hand, re: '(?:喑|嗚)◎', note: 喑嗚、嗚嗚}
  - {id: ming-禽獸聲, char: 鳴, src: hand, re: '(?:雞|鷄|犬|狗|蟬|蛩|蟲|鶴|鳳|鸞|雁|鴈|鶯|鳥|馬|牛|龍|虎|猿|鹿|鵑|鷹|雷)◎(?![呼乎咽哉])', note: 雞鳴、犬鳴、蟬鳴、鶴鳴、鳳鳴、馬鳴、龍鳴}
  - {id: ming-器聲, char: 鳴, src: hand, re: '(?:鐘|鼓|琴|瑟|笳|簫|笛|珂|珮|佩|弦|絃|筑|砧|金|玉)◎(?![呼乎咽哉])', note: 鐘鳴、鼓鳴、琴鳴、鳴珂}
  - {id: ming-鳴後, char: 鳴, src: hand, re: '◎(?:鳥|鸞|鑾|鳳|鶴|雞|鷄|犬|蟬|蟲|琴|鐘|鼓|珂|珮|佩|弦|謙|條|筑|笳|砧|雁|鴈|鶯|鷹|鵑|玉|金)', note: 鳴鳥、鳴鑾、鳴琴、鳴鐘、鳴謙、鳴條、鳴珂}
  - {id: ming-自共, char: 鳴, src: hand, re: '(?:自|共|相|競|爭|遞|互|並|齊|同)◎(?:[^一-鿿]|$)', note: 自鳴、共鳴、相鳴（后接标点才收）}
