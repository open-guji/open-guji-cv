schema: ctx_l1/1
group: yh
# 遺還 L1：遺远多于還（整理本约 155:23）。收「遺文、補遺、遺書」「還朝、返還」类；「以還／未還」等两可不给字。
rules:
  - {id: yh-遺文, char: 遺, src: hand, re: '◎(?:文|書|集|稿|事|詩|像|言|籍|佚|編|說|響|訓|命|詔|表|志|蹟|跡|風|規|脫|闕|逸|漏|失|落|民|老|臣|珠|意|墨|札|簡)|(?:補|拾|散|殘|闕|軼|佚|漏|無)◎(?![以與自至歸還])', note: 遺文、遺書、遺集、遺稿、遺事、補遺、拾遺、散遺、闕遺、無遺、遺漏、遺失、遺民…}
  - {id: yh-還朝, char: 還, src: hand, re: '◎(?:朝|京|鄉|鄕|家|歸|俗|至|復|原|報)|(?:往|旋|返|召|放|赦|送|賜)◎(?![文書集稿事詩像言籍])', note: 還朝、還京、還鄉、還家、還歸、還俗、還至、還復、還原、往還、旋還、返還、召還、放還、賜還}
# A24 2026-10-26：中心库码位 鄉→鄕（暂归一）后整理本／放行字改用 鄕，還鄉 补 鄕（入人八线程提醒）。
