schema: ctx_l1/1
group: xz
# 象彖 L1：只收「象」无歧义的词组。彖傳／象傳、彖曰／象曰、彖辭／象辭 两字都成词，一律弃权交 L2 按语境（释卦辞＝彖；释卦象＝象）。
rules:
  - {id: xz-象數, char: 象, src: hand, re: '◎(?:數|形|外|占|緯)|(?:爻|取|懸|法|物|氣)◎(?!傳|辭|曰|詞)', note: 象數、象形、象外、爻象、取象、懸象、法象、氣象（「卦象」「圖象」「易象」另有彖字可能，不收）}
  - {id: xz-大象, char: 象, src: hand, re: '(?:大|小)◎(?:傳|曰)', note: 大象傳、小象傳（「大彖」不成词）}
