schema: ctx_l1/1
group: fc
rules:
  - {id: fc-傳-l1, char: 傳, src: corpus-pure, re: '[左本程彖所卦詩象之不孔大外毛無辭相苑其學爲氏上翼以有作三下諸子别言秋國曰流]◎', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: fc-傳-l2, char: 傳, src: corpus-pure, re: '(?:史本|儒林|說卦|繫辭|文苑|雜卦|詩集|以程|序卦|子之|傳象|春秋|安國|沈集|以蔡|夏易|文言|久無|以彖|儒學|書大|書集|作易|作書|以集)◎', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: fc-傳-r1, char: 傳, src: corpus-pure, re: '◎[之爲是本者所其則義中十三稱不二於附及通亦有一自云序象與鄭曰也易此注大又惟次授纂故至多四始刻後皆]', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: fc-傳-r2, char: 傳, src: corpus-pure, re: '◎(?:是書|爲主|其書|象傳|三十|是編|二卷|寫者|爲宗|通釋)', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: fc-傳-m, char: 傳, src: corpus-pure, re: '(?:本◎是|集◎爲|無◎本|集◎之|彖◎象|蔡◎之|易◎之|蔡◎所)', note: 整理本奇偶册交叉验证零冲突；n≥8}
  - {id: fc-傅-r1, char: 傅, src: corpus-pure, re: '◎[寅]', note: 整理本奇偶册交叉验证零冲突；n≥3}
  - {id: fc-傅-hand, char: 傅, src: hand, re: '◎(?:寅|以漸|巖)', note: 傅會、傅寅、傅以漸、傅巖、傅說、傅良；太傅、師傅、王宗傅、蔡傅、陳傅良}
