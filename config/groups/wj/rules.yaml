schema: ctx_l1/1
group: wj
# 問間 L1：間（其間、間有、年間）多于問；只收词组把握十足的。「X 之間／之問」「學間／學問」等前接字两可，或后接「以／者／曰」的不给字。
rules:
  - {id: wj-問答, char: 問, src: hand, re: '◎(?:答|學|難|辨|辯|訊|疾|禮)|(?:訊|詢|質|審|答|設|咨|疑|顧|訪|請|詰|責|鞫|慰)◎', note: 問答、問學、問難、問辨、問訊、問疾、訊問、詢問、質問、答問、設問、疑問、顧問、詰問}
  - {id: wj-或問, char: 問, src: hand, re: '(?:或|客)◎(?:曰|云|焉)', note: 或問曰、客問曰}
  - {id: wj-其間, char: 間, src: hand, re: '其◎(?=[有或多頗亦時往每皆不所雜])|(?:中|民|世|人|(?<!三)年|行|夜|晝|空|眉|山|林|田|野)◎(?![答學難辨辯訊疾禮以者曰云易焉而])|◎(?:有|或|嘗|出|見|引|用|采|存|雜|架|隙|諜|斷)', note: 其間、中間、民間、世間、人間、年間、行間、（A24 10-24：「三年」後不算、去掉 字 雜——「三年問篇」「字問源」「雜問篇」）間有、間或、間嘗、間出、間見、間引、間用、間采、間存、間雜、間架、間隙、間諜}
  - {id: wj-否決-或問有, char: null, re: '[或客余予人嘗吾子生使及有音]◎(?:有|或|嘗|出|見|引|用|采|存|雜)', note: 「或問有…」與「或間有」可能混；整格弃权。A24 10-24 加 及／有／音（vol11–20「及問有禘」「有問有答」「音問引」）}
