*,*::before,*::after{box-sizing:border-box}

body{margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%;}
.wrap{max-width:34rem; margin:0 auto; padding:0 14px 96px;}

.top{position:sticky; top:0; z-index:20; background:var(--ground);
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px) saturate(1.2); border-bottom:1px solid var(--rule);}
.top-in{max-width:34rem; margin:0 auto; padding:9px 14px 0;
  display:flex; align-items:baseline; gap:9px;}
.brand{font-family:var(--serif); font-weight:700; font-size:16px; letter-spacing:.02em;}
.save{font-size:10.5px; letter-spacing:.03em; padding:1px 6px; border-radius:2px;
  color:var(--muted); background:var(--sunk); white-space:nowrap;}
.save[data-s="saved"]{color:var(--ok); background:var(--ok-soft)}
.save[data-s="busy"],.save[data-s="wait"]{color:var(--indigo); background:var(--indigo-soft)}

.count{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted);

.ghost:focus-visible,.seg button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px;}

.list{display:grid; gap:12px; margin-top:12px;}
.empty{padding:34px 10px; text-align:center; color:var(--faint); font-size:13.5px;}

.sheet[hidden]{display:none}
.sheet-in{width:100%; max-width:34rem; background:var(--surface); border-radius:6px 6px 0 0;

.sheet p{margin:0; font-size:12.5px; color:var(--muted)}

  background:var(--ground); border:1px solid var(--rule); border-radius:3px;}
.sheet .row{display:flex; gap:8px}
.sheet .row .ghost{flex:1; min-height:44px}

<script id="js">
const MEMBERS = ["己", "已", "巳"];
const BODY = `
<header class="top"><div class="top-in">
  <span class="brand">己已巳·放行复核人裁</span>
  <span class="save" id="save">本机</span>
  <span class="count" id="count">0 / 0</span>
</div><div class="bar"><i id="prog"></i></div></header>
<div class="wrap">
  <details class="intro" id="intro" open>
    <summary>怎么裁</summary>
    <p>字组「己已巳·放行复核」人裁：vol05–10 里机器已给字的格，按给的字与通道分层随机抽（含 1 格上轮人裁疑有误的复核）（pool 30 格、recheck 1 格，共 31 格）。看字块和上下文，点这一格实际是哪个字。</p>
    <p>挖空高亮的 <span style="font-family:var(--serif)">〔　〕</span> 就是这一格。上一行是刻本读序前后各 30 字（机器读的，可能有错字），
       下一行是整理本对应位置的 30 字（「·」是整理本这里没对上字）。机器给的字收在「机器参考」里，想核对再点开。</p>
    <p>按钮是这一组的字；不是组里的字点「别的字」再填；图看不清、切坏了点「看不清」。点错再点一次取消。
       裁决自动存回本页，右上角牌子显示<code>已存</code>就是存上了；要是一直是<code>仅存本机</code>，用「复制」把结果贴回对话。</p>
  </details>
  <div class="ctrl">
    <div class="seg" id="filter">
      <button data-f="todo" aria-pressed="true">未裁</button>
      <button data-f="all"  aria-pressed="false">全部</button>
      <button data-f="done" aria-pressed="false">已裁</button>
    </div>
    <button class="ghost" id="copy">复制</button>
    <button class="ghost" id="reset">清空</button>
  </div>
  <div class="list" id="list"></div>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-in">
  <h2>裁决结果</h2><p id="sheet-note"></p>
  <textarea id="sheet-text" readonly></textarea>
  <div class="row"><button class="ghost" id="sheet-copy">复制</button>
  <button class="ghost" id="sheet-close">关闭</button></div>
</div></div>`;

const rowId = r => r.id;
const HOLE = '<span class="t">〔　〕</span>';

function card(r){
  const v = verdictOf(r.id);
  const isOther = v === 'other' || v.startsWith('other:');
  const mem = MEMBERS.map(c => `<button class="m" data-v="${c}" aria-pressed="${v===c}">${c}</button>`).join('');
  const typed = v.startsWith('other:') ? v.slice(6) : '';
  return `<article class="card" data-id="${r.id}"${v ? ` data-v="${esc(v)}"` : ''}>
    <div class="head">
      <div class="glyph">${r.img ? `<img data-src="c:${r.id}" alt="字块">` : '<span class="meta">无图</span>'}</div>
      <div class="meta"><b>${esc(r.book)}</b> 第 ${r.page} 页<br>第 ${r.col} 列 第 ${r.slot}${r.sub ? r.sub : ''} 字<br>${esc(r.no)}</div>
    </div>
    <div><div class="lab">刻本读序</div><p class="ctx">${esc(r.left)}${HOLE}${esc(r.right)}</p></div>
    <div class="ref"><div class="lab">整理本对应</div><p class="ctx">${esc(r.ref_left)}${HOLE}${esc(r.ref_right)}</p></div>
    <div class="verdicts">${mem}<button class="other" data-v="other" aria-pressed="${isOther}">别的字</button><button class="unclear" data-v="unclear" aria-pressed="${v==='unclear'}">看不清</button></div>
    ${isOther ? `<label class="otherbox">是哪个字：<input id="o-${r.id}" data-id="${r.id}" maxlength="2" value="${esc(typed)}" autocomplete="off"></label>` : ''}
    <details class="fold"><summary>机器参考</summary><div class="mach">
      放行字 <span>${esc(r.m_char || '—')}</span>　整理本此处 <span>${esc(r.m_ref || '—')}</span>　通道 ${esc(r.m_channel || '—')}</div></details>
    ${r.colimg ? `<details class="fold col" data-id="${r.id}"><summary>整列小图</summary><div class="colwrap"><img data-src="k:${r.id}" alt="整列"><i style="top:${r.col_top*100}%;height:${Math.max(r.col_h*100,0.8)}%"></i></div></details>` : ''}
  </article>`;
}

let filter = 'todo';
function visibleRows(){
  if (filter === 'all') return D.rows;
  const done = filter === 'done';
  return D.rows.filter(r => !!verdictOf(r.id) === done);
}
document.addEventListener('click', e => {
  const b = e.target.closest('#filter button'); if (!b) return;
  filter = b.dataset.f;
  [...b.parentElement.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  draw();
});
/* 整列小图：点开才塞图（不进懒加载观察，免得折叠着也下载） */
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.col') || !d.open) return;
  const img = d.querySelector('img[data-src]'); if (!img) return;
  img.src = D.imgs[img.dataset.src]; img.removeAttribute('data-src');
}, true);
/* 「别的字」：点了先记 other，卡下冒出输入框；填了字记成 other:<字> */
function setOther(id, ch){
  ch = (ch || '').trim();
  state[id] = {v: ch ? 'other:' + ch : 'other', t: Date.now()};
  persist(); tally();
  const art = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (art) art.dataset.v = state[id].v;
}
document.addEventListener('change', e => {
  const i = e.target.closest('.otherbox input'); if (i) setOther(i.dataset.id, i.value);
});
document.addEventListener('keydown', e => {
  const i = e.target.closest && e.target.closest('.otherbox input');
  if (i && e.key === 'Enter'){ i.blur(); }
});
/* 记下刚点的是哪张卡（捕获阶段，先于壳的处理）；手机上按钮不一定拿得到焦点，别靠 activeElement。
   已填了字的「别的字」再点一次＝取消：先把它退回 other，壳那边同值再点就删掉。 */
let lastId = '';
document.addEventListener('click', e => {
  const b = e.target.closest('.verdicts button'); if (!b) return;
  lastId = b.closest('.card').dataset.id;
  if (b.dataset.v === 'other' && verdictOf(lastId).startsWith('other:')) state[lastId] = {v: 'other', t: Date.now()};
}, true);
function redrawCard(id){
  const art = listEl.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if (!art) return;
  art.outerHTML = card(D.rows.find(r => r.id === id));
  listEl.querySelectorAll('img[data-src^="c:"]').forEach(i => io.observe(i));
}
function afterVerdict(){
  const id = lastId, v = id ? verdictOf(id) : '';
  /* 「别的字」要等人填字：这张卡原地重画、冒出输入框，先别从「未裁」档里拿走 */
  if (v === 'other'){ redrawCard(id); const inp = document.getElementById('o-' + id); if (inp) inp.focus(); return; }
  if (filter !== 'all'){ const y = scrollY; draw(); scrollTo(0, y); }
  else if (id) redrawCard(id);
}
function payload(){
  return D.rows.filter(r => verdictOf(r.id)).map(r => JSON.stringify({id: r.id, verdict: verdictOf(r.id),
    stratum: r.stratum, stratum_weight: r.stratum_weight})).join('\n');
}

const D = JSON.parse(document.getElementById('data').textContent);
const HEAD = "<title>\u5df1\u5df2\u5df3\u00b7\u653e\u884c\u590d\u6838\u4eba\u88c1</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap\">", KEY = "char-groups-jys2-review-z1", LANG = "zh-Hans";

/* ---------- 裁决状态：{id:{v,t}}，与页里嵌的那份按时间戳合并 ---------- */
function readLocal(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); }
                      catch(e){ return {}; } }
function mergeState(a, b){
  const out = {...a};
  for (const k in b) if (!(k in out) || (b[k].t||0) > (out[k].t||0)) out[k] = b[k];
  return out;
}
let state = mergeState(D.verdicts || {}, readLocal());
const verdictOf = id => (state[id] || {}).v || '';
const doneCount = () => D.rows.filter(r => verdictOf(rowId(r))).length;
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  queueSave();
}
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('app').innerHTML = BODY;

/* ---------- 列表 ---------- */
const listEl = document.getElementById('list');
let flashT = 0;
function flash(msg){
  const el = document.getElementById('count');
  el.textContent = msg; clearTimeout(flashT); flashT = setTimeout(tally, 2200);
}
function tally(){
  const done = doneCount(), n = D.rows.length;
  document.getElementById('count').textContent = `${done} / ${n} 已裁`;
  document.getElementById('prog').style.width = (done / n * 100) + '%';
}
function draw(){
  const rows = visibleRows();
  listEl.innerHTML = rows.length ? rows.map(card).join('')
    : `<p class="empty">这一档里没有卡片了。</p>`;
  listEl.querySelectorAll('img[data-src]').forEach(i => io.observe(i));
  tally();
}
const io = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting){
    const img = e.target, k = img.dataset.src;
    if (k && D.imgs[k]) img.src = D.imgs[k];
    img.removeAttribute('data-src'); io.unobserve(img);
  }
}, {rootMargin: '700px 0px'});

listEl.addEventListener('click', e => {
  const b = e.target.closest('.verdicts button'); if (!b) return;
  const art = b.closest('.card'), id = art.dataset.id, v = b.dataset.v;
  if (verdictOf(id) === v) delete state[id]; else state[id] = {v, t: Date.now()};
  persist();
  const now = verdictOf(id);
  art.querySelectorAll('.verdicts button').forEach(x =>
    x.setAttribute('aria-pressed', String(now === x.dataset.v)));
  if (now) art.dataset.v = now; else art.removeAttribute('data-v');
  tally();
  if (typeof afterVerdict === 'function') afterVerdict();
});

/* ---------- 自存：把自己重发一版 ---------- */
const saveEl = document.getElementById('save');
const SAVE_TEXT = {"idle": "本机", "wait": "待存", "busy": "存中…", "saved": "已存", "local": "仅存本机", "ro": "只读"};
function setSave(s, extra){ saveEl.dataset.s = s; saveEl.textContent = extra || SAVE_TEXT[s] || s; }
let ns = null, canPub = false, timer = 0, inflight = false, dirty = false;
/* 头一次存**快**（2 秒），好让「存不了」这件事当场露出来而不是等到最后；
   之后 6 秒防抖。html 兜底模式下会重发整页并重载本视图，所以放慢到 30 秒。 */
let delay = 2000, mode = 'files';

function renderIndex(){
  const css = document.getElementById('css').textContent;
  const js  = document.getElementById('js').textContent;
  const data = JSON.stringify({...D, verdicts: state}).split('</').join('<\\/');
  return '<!doctype html>\n<html lang="' + LANG + '">\n<head>\n<meta charset="utf-8">\n'
    + HEAD + '\n<style id="css">' + css + '</style>\n</head>\n<body>\n'
    + '<div id="app"></div>\n'
    + '<script type="application/json" id="data">' + data + '<\/script>\n'
    + '<script id="js">' + js + '<\/script>\n</body>\n</html>\n';
}
function queueSave(){
  dirty = true;
  if (!canPub){ setSave('local'); return; }
  setSave('wait'); clearTimeout(timer); timer = setTimeout(save, delay);
}
async function publishNow(html){
  /* files 形式不重载本视图，是首选；它在有些视图上根本不开放（capability_disabled），
     那就退回 html 形式——会重载本视图，但裁决在 localStorage 里，重载回来还在。 */
  if (mode === 'files'){
    try { return await ns.publish({'index.html': html}); }
    catch (e){
      if ((e && e.code) !== 'capability_disabled') throw e;
      mode = 'html';
    }
  }
  return await ns.publish(html);
}
async function save(){
  if (!canPub || !dirty || inflight) return;
  inflight = true; setSave('busy');
  const snap = JSON.stringify(state);
  try {
    await publishNow(renderIndex());
    dirty = JSON.stringify(state) !== snap;
    delay = mode === 'files' ? 6000 : 30000;
    setSave(dirty ? 'wait' : 'saved');
    if (dirty) timer = setTimeout(save, delay);
  } catch (err){
    const code = (err && err.code) || 'upstream_error';
    if (code === 'conflict') setSave('busy', '别处已改');
    else if (['not_writer','not_granted','not_declared','capability_disabled',
              'capability_removed','consent_required'].includes(code)){
      canPub = false; setSave('ro', '只读·' + code);
    } else if (code === 'too_large' || code === 'invalid_content'){
      canPub = false; setSave('local', '仅存本机·' + code);
    } else if (code === 'rate_limited'){
      delay = Math.min(Math.max(delay, 6000) * 2, 60000);
      setSave('wait'); timer = setTimeout(save, delay);
    } else { setSave('wait', '重试中·' + code); timer = setTimeout(save, 8000); }
  } finally { inflight = false; }
}
function flush(){ if (canPub && dirty){ clearTimeout(timer); save(); } }
addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
addEventListener('pagehide', flush);
/* 开页就比一次：本机比页里嵌的那份新，说明上一轮的裁决还没推上去
   （能力当时没拿到、或者关得太快）——立刻补推，别等下一次点击。 */
const behind = JSON.stringify(state) !== JSON.stringify(D.verdicts || {});
if (window.claude && typeof window.claude.use === 'function'){
  setSave('idle');
  window.claude.use('artifact').then(x => {
    ns = x; canPub = !!x;
    if (!canPub){ setSave('local'); return; }
    if (dirty || behind){ dirty = true; setSave('wait');
                          clearTimeout(timer); timer = setTimeout(save, delay); }
    else setSave('saved');
  }).catch(() => setSave('local'));
} else setSave('local');

/* ---------- 复制（自存拿不到时的退路） ---------- */
const sheet = document.getElementById('sheet'), sheetText = document.getElementById('sheet-text');
document.getElementById('copy').addEventListener('click', async () => {
  const txt = payload();
  if (!txt){ flash('还没有裁决可复制。'); return; }
  sheetText.value = txt; sheet.hidden = false;
  try { await navigator.clipboard.writeText(txt);
        document.getElementById('sheet-note').textContent = '已复制到剪贴板。下面是全文，可再手动选。'; }
  catch(e){ document.getElementById('sheet-note').textContent = '长按选中全文复制，或用下面的按钮。'; }
});
document.getElementById('sheet-copy').addEventListener('click', async () => {
  sheetText.focus(); sheetText.select();
  try { await navigator.clipboard.writeText(sheetText.value);
        document.getElementById('sheet-note').textContent = '已复制。'; }
  catch(e){ document.getElementById('sheet-note').textContent = '复制没成功，请长按选中。'; }
});
document.getElementById('sheet-close').addEventListener('click', () => sheet.hidden = true);
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
const resetBtn = document.getElementById('reset');
let armed = 0;
resetBtn.addEventListener('click', () => {
  if (!armed){ armed = 1; resetBtn.textContent = '确认清空？';
               setTimeout(() => { armed = 0; resetBtn.textContent = '清空'; }, 3000); return; }
  armed = 0; resetBtn.textContent = '清空';
  state = {}; persist(); draw(); flash('已清空。');
});
const intro = document.getElementById('intro');
try { if (localStorage.getItem(KEY + '-intro') === 'shut') intro.open = false; } catch(e){}
intro.addEventListener('toggle', () => {
  try { localStorage.setItem(KEY + '-intro', intro.open ? 'open' : 'shut'); } catch(e){}
});
draw();
</script>
