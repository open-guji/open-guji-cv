      seed_admit:
        group_flow: [mn, dian, can, chen, li, shen, zhi, jys, ry, rr]
        group_flow_freq: /tmp/abwork/freq_new.json
        group_flow_tables:
          jys: /tmp/abwork/tables/jys_table.json
          ry: /tmp/abwork/tables/ry_table.json
          rr: /tmp/abwork/tables/rr_table.json
  C:
    note: B＋即卽、卿𨜊、變𠮓、彙彚
    params:
      seed_admit:
        group_flow: [mn, dian, can, chen, li, shen, zhi, jys, ry, rr, ji, qing, bian, hui]
        group_flow_freq: /tmp/abwork/freq_new.json
        group_flow_tables:
          jys: /tmp/abwork/tables/jys_table.json
          ry: /tmp/abwork/tables/ry_table.json
          rr: /tmp/abwork/tables/rr_table.json
